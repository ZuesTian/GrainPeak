<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171b26" />
    <meta name="description" content="GrainPeak 在线粒度分布多峰拟合工作台" />
    <title>GrainPeak · 在线粒度分峰</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="https://zuestian.github.io/Cnanotools/">← CNT LAB</a>
      <span>GRAIN DISTRIBUTION DECONVOLUTION</span>
      <a href="https://github.com/ZuesTian/GrainPeak" target="_blank" rel="noreferrer">SOURCE ↗</a>
    </header>

    <main>
      <section class="intro">
        <p class="eyebrow">SCIENTIFIC FITTING WORKBENCH / 05</p>
        <h1>把粒度分布拆成<br /><em>可解释的峰。</em></h1>
        <p>上传两列粒径—强度数据，选择坐标变换与峰形模型，在线完成多峰拟合、质量评估和参数导出。</p>
      </section>

      <section class="workspace">
        <aside class="controls panel">
          <div class="panel-title"><span>01</span><h2>数据与模型</h2></div>
          <label class="dropzone" id="dropzone">
            <input id="fileInput" type="file" accept=".txt,.csv,.dat,text/plain,text/csv" />
            <b id="fileLabel">选择或拖入数据文件</b>
            <small>TXT / CSV / DAT · 两列数值 · 最大 2 MB</small>
          </label>
          <button class="quiet-button" id="sampleButton" type="button">加载内置示例</button>

          <div class="field-grid">
            <label>横坐标模式<select id="axisMode"><option value="linear">正常坐标</option><option value="log10">Log10</option><option value="ln">Ln</option></select></label>
            <label>峰数量<input id="peakCount" type="number" min="1" max="8" value="4" /></label>
          </div>
          <label>拟合模型<select id="model"><option value="pseudo_voigt">伪沃伊特函数</option><option value="skew_normal">偏斜高斯混合</option><option value="gaussian">标准高斯混合</option></select></label>
          <label class="check"><input id="fixedFour" type="checkbox" /> 使用 CNT 四峰固定初值</label>
          <button class="primary-button" id="fitButton" type="button" disabled><span>开始拟合</span><b>→</b></button>
          <p class="privacy">数据仅随本次拟合请求发送到分析服务，不写入数据库。</p>
        </aside>

        <section class="results panel">
          <div class="panel-title result-title"><div><span>02</span><h2>拟合结果</h2></div><button id="exportButton" type="button" disabled>导出 CSV</button></div>
          <div class="empty-state" id="emptyState"><i></i><p>加载数据并运行拟合后，曲线与峰参数会显示在这里。</p></div>
          <div class="result-content" id="resultContent" hidden>
            <div class="metrics"><article><small>R²</small><strong id="rSquared">—</strong></article><article><small>RMSE</small><strong id="rmse">—</strong></article><article><small>数据点</small><strong id="pointCount">—</strong></article><article><small>模型</small><strong id="modelName">—</strong></article></div>
            <div class="chart-wrap"><svg id="chart" viewBox="0 0 960 440" role="img" aria-label="粒度拟合曲线"></svg><div class="legend"><span class="raw">原始数据</span><span class="total">总拟合</span><span class="parts">分峰</span></div></div>
            <div class="table-wrap"><table><thead><tr><th>峰</th><th>中心</th><th>峰高</th><th>宽度</th><th>面积占比</th><th>物理意义</th></tr></thead><tbody id="peakRows"></tbody></table></div>
          </div>
          <div class="message" id="message" hidden></div>
        </section>
      </section>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
